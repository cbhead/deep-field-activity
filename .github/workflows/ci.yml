name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # The npm scripts all shell through zsh, which current ubuntu runners no
      # longer preinstall.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check
      - run: npm run build
