<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tower Defense</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <!--
        Board and chrome letterbox as one unit. The stage is sized to the board
        PLUS the height the deck reserves beneath it, and scaled once; the deck
        therefore sits below the board rather than over it, so no route tile is
        ever hidden by the thing you use to defend it.
      -->
      <div id="stage">
        <div id="game-root">
          <!-- Pixi's canvas is injected here. World-anchored visuals live inside it. -->
        </div>
        <div id="hud"></div>
      </div>

      <!--
        Full-viewport screens: home, campaign picker, race lobby, race results.

        Deliberately OUTSIDE #stage. The stage is sized to the board's logical
        1040x600 and scaled by --board-scale, so a screen mounted inside it
        renders into a fraction of the viewport, resolves its own `vw` units
        against a box it is not in, and cannot scroll cleanly through the
        transform. The stage is a picture; these are documents.
      -->
      <div id="screens"></div>

      <!--
        Shown only on a portrait phone, and only once a board exists — see the
        #rotate rules in styles.css. Static markup rather than something the app
        renders, so it cannot disagree with the orientation the browser is
        actually in.
      -->
      <div id="rotate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="7" width="18" height="10" rx="2" />
          <path d="M8 3.5a9 9 0 0 1 4-1" />
          <path d="m10.5 1.5-2 2 2 2" />
        </svg>
        <b>Rotate to play</b>
        <span>Deep Field needs a landscape screen — turn your device sideways.</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
