<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tower Defense</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <!--
        Board and chrome letterbox as one unit. The stage is sized to the board
        PLUS the height the deck reserves beneath it, and scaled once; the deck
        therefore sits below the board rather than over it, so no route tile is
        ever hidden by the thing you use to defend it.
      -->
      <div id="stage">
        <div id="game-root">
          <!-- Pixi's canvas is injected here. World-anchored visuals live inside it. -->
        </div>
        <div id="hud"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
